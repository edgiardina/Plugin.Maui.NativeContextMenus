name: Create a (Pre)release on NuGet

on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"
    - "v[0-9]+.[0-9]+.[0-9]+-preview[0-9]+"

env:
  DOTNET_VERSION: '10.0.x' # The .NET SDK version to use

jobs:
  release-nuget:
  
    runs-on: windows-latest

    # Trusted publishing: nuget.org exchanges the GitHub OIDC token for a short-lived API key
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install .NET MAUI Workload
        run: dotnet workload restore samples\Plugin.Maui.NativeContextMenus.Sample.sln

      - name: Verify commit exists in origin/main
        run: |
          git fetch --no-tags --prune --depth=1 origin +refs/heads/*:refs/remotes/origin/*
          git branch --remote --contains | grep origin/main
      - name: Get version information from tag
        id: get_version
        run: |
          $version="${{github.ref_name}}".TrimStart("v")
          "version-without-v=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Pack
        run: dotnet pack src\Plugin.Maui.NativeContextMenus.sln -c Release -p:PackageVersion=${{ steps.get_version.outputs.version-without-v }}
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: Richthofen # The nuget.org profile name that owns the trusted publishing policy
      - name: Push
        run: dotnet nuget push src\Plugin.Maui.NativeContextMenusin\Release\Plugin.Maui.NativeContextMenus.${{ steps.get_version.outputs.version-without-v }}.nupkg -s https://api.nuget.org/v3/index.json -k ${{ steps.login.outputs.NUGET_API_KEY }}
